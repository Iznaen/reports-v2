<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>reports-v2</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Leaflet Map CSS/JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
      window.initSignaturePad = function(canvasId) {
          const tryInit = () => {
              const canvas = document.getElementById(canvasId);
              if (!canvas) {
                  setTimeout(tryInit, 50);
                  return;
              }
              if (canvas.dataset.initialized) return;
              canvas.dataset.initialized = "true";
              
              const ctx = canvas.getContext('2d');
              let isDrawing = false;
              let lastX = 0; let lastY = 0;
              
              function getPos(e) {
              const rect = canvas.getBoundingClientRect();
              const clientX = e.touches ? e.touches[0].clientX : e.clientX;
              const clientY = e.touches ? e.touches[0].clientY : e.clientY;
              return [clientX - rect.left, clientY - rect.top];
          }
          
          function start(e) {
              e.preventDefault();
              isDrawing = true;
              const pos = getPos(e);
              lastX = pos[0]; lastY = pos[1];
          }
          
          function draw(e) {
              if (!isDrawing) return;
              e.preventDefault();
              const pos = getPos(e);
              ctx.beginPath();
              ctx.moveTo(lastX, lastY);
              ctx.lineTo(pos[0], pos[1]);
              ctx.strokeStyle = '#1a3a5c';
              ctx.lineWidth = 3;
              ctx.lineCap = 'round';
              ctx.stroke();
              lastX = pos[0]; lastY = pos[1];
          }
          
          function stop() { isDrawing = false; }
          
          canvas.addEventListener('mousedown', start);
          canvas.addEventListener('mousemove', draw);
          canvas.addEventListener('mouseup', stop);
          canvas.addEventListener('mouseout', stop);
          canvas.addEventListener('touchstart', start, {passive: false});
          canvas.addEventListener('touchmove', draw, {passive: false});
          canvas.addEventListener('touchend', stop);
        };
        tryInit();
      };

      window.leafletState = { map: null, marker: null };

      window.initLeafletMap = function(mapId) {
          const tryInit = () => {
              const container = document.getElementById(mapId);
              if (!container) {
                  setTimeout(tryInit, 50);
                  return;
              }
              if (container.dataset.initialized) return;
              container.dataset.initialized = "true";
              
              container.innerHTML = "";
              
              const initialLat = -3.973775351502879;
              const initialLng = 122.5057339668274;
              
              const map = L.map(mapId).setView([initialLat, initialLng], 13);
              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                  maxZoom: 19,
                  attribution: '© OpenStreetMap'
              }).addTo(map);
              
              const marker = L.marker([initialLat, initialLng], {draggable: true}).addTo(map);

              window.leafletState.map = map;
              window.leafletState.marker = marker;
          };
          tryInit();
      };

      window.resetLeafletMap = function() {
          if (!window.leafletState.map) return;
          const initialLat = -3.973775351502879;
          const initialLng = 122.5057339668274;
          
          window.leafletState.map.setView([initialLat, initialLng], 13);
          window.leafletState.marker.setLatLng([initialLat, initialLng]);
          
          // Force leaflet to recalculate grid sizes now that display: block is active
          setTimeout(() => { 
              window.leafletState.map.invalidateSize(); 
          }, 100);
      };

      window.getMapSelection = function() {
          if (!window.leafletState.marker) return null;
          const pos = window.leafletState.marker.getLatLng();
          return [pos.lat, pos.lng];
      };

      window.captureAttendancePhoto = function(statusText) {
          return new Promise((resolve, reject) => {
              navigator.geolocation.getCurrentPosition((pos) => {
                  const lat = pos.coords.latitude;
                  const lng = pos.coords.longitude;

                  const input = document.createElement('input');
                  input.type = 'file';
                  input.accept = 'image/*';
                  input.capture = 'user';
                  
                  input.onchange = (e) => {
                      const file = e.target.files[0];
                      if (!file) { reject("Tidak ada foto yang dipilih"); return; }
                      
                      const img = new Image();
                      img.onload = () => {
                          const canvas = document.createElement('canvas');
                          const targetWidth = 800;
                          const targetHeight = 600;
                          canvas.width = targetWidth;
                          canvas.height = targetHeight;
                          const ctx = canvas.getContext('2d');
                          
                          const imgRatio = img.width / img.height;
                          const targetRatio = targetWidth / targetHeight;
                          let drawWidth = img.width;
                          let drawHeight = img.height;
                          let offsetX = 0;
                          let offsetY = 0;
                          
                          if (imgRatio > targetRatio) {
                              drawWidth = img.height * targetRatio;
                              offsetX = (img.width - drawWidth) / 2;
                          } else {
                              drawHeight = img.width / targetRatio;
                              offsetY = (img.height - drawHeight) / 2;
                          }
                          
                          ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight, 0, 0, targetWidth, targetHeight);
                          
                          // Draw Watermark
                          const now = new Date();
                          const hariIndo = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                          const bulanIndo = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
                          
                          const hari = hariIndo[now.getDay()];
                          const tanggal = now.getDate() + ' ' + bulanIndo[now.getMonth()] + ' ' + now.getFullYear();
                          const jam = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
                          
                          // Top badge (polyfilled for roundRect fallback if needed, but roundRect works in modern WV)
                          ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
                          ctx.beginPath();
                          if (ctx.roundRect) {
                              ctx.roundRect(20, 20, 180, 40, 8);
                          } else {
                              ctx.rect(20, 20, 180, 40);
                          }
                          ctx.fill();
                          ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
                          ctx.stroke();
                          
                          ctx.fillStyle = "#ffffff";
                          ctx.font = "bold 20px sans-serif";
                          ctx.fillText(statusText.toUpperCase(), 35, 47);
                          
                          // Bottom bar
                          ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                          ctx.beginPath();
                          if (ctx.roundRect) {
                              ctx.roundRect(20, targetHeight - 90, targetWidth - 40, 70, 10);
                          } else {
                              ctx.rect(20, targetHeight - 90, targetWidth - 40, 70);
                          }
                          ctx.fill();
                          
                          ctx.fillStyle = "#ffffff";
                          ctx.font = "16px sans-serif";
                          ctx.globalAlpha = 0.9;
                          ctx.fillText(hari, 35, targetHeight - 65);
                          
                          ctx.font = "bold 16px sans-serif";
                          ctx.globalAlpha = 1.0;
                          ctx.fillText(tanggal, 35, targetHeight - 40);
                          
                          const tangWidth = ctx.measureText(tanggal).width;
                          ctx.font = "16px sans-serif";
                          ctx.globalAlpha = 0.8;
                          ctx.fillText(jam, 35 + tangWidth + 15, targetHeight - 40);
                          
                          const coordStr = lat.toFixed(5) + ", " + lng.toFixed(5);
                          ctx.font = "14px 'Courier New', monospace";
                          const coordWidth = ctx.measureText(coordStr).width;
                          
                          ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
                          ctx.beginPath();
                          if (ctx.roundRect) {
                              ctx.roundRect(targetWidth - coordWidth - 45, targetHeight - 55, coordWidth + 20, 24, 12);
                          } else {
                              ctx.rect(targetWidth - coordWidth - 45, targetHeight - 55, coordWidth + 20, 24);
                          }
                          ctx.fill();
                          
                          ctx.fillStyle = "#ffffff";
                          ctx.globalAlpha = 0.85;
                          ctx.fillText(coordStr, targetWidth - coordWidth - 35, targetHeight - 38);
                          
                          const base64Data = canvas.toDataURL("image/jpeg", 0.8);
                          resolve({ base64Data, lat, lng });
                      };
                      img.src = URL.createObjectURL(file);
                  };
                  
                  input.click();
              }, (err) => {
                  reject("Gagal mendapatkan lokasi GPS. Pastikan izin lokasi (Location) aktif.");
              }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
          });
      };

      window.captureTaskPhoto = function() {
          return new Promise((resolve, reject) => {
              navigator.geolocation.getCurrentPosition((pos) => {
                  const lat = pos.coords.latitude;
                  const lng = pos.coords.longitude;

                  const input = document.createElement('input');
                  input.type = 'file';
                  input.accept = 'image/*';
                  input.capture = 'environment';
                  
                  input.onchange = (e) => {
                      const file = e.target.files[0];
                      if (!file) { reject("Tidak ada foto yang dipilih"); return; }
                      
                      const img = new Image();
                      img.onload = () => {
                          const canvas = document.createElement('canvas');
                          const targetWidth = 800;
                          const targetHeight = 600;
                          canvas.width = targetWidth;
                          canvas.height = targetHeight;
                          const ctx = canvas.getContext('2d');
                          
                          const imgRatio = img.width / img.height;
                          const targetRatio = targetWidth / targetHeight;
                          let drawWidth = img.width;
                          let drawHeight = img.height;
                          let offsetX = 0;
                          let offsetY = 0;
                          
                          if (imgRatio > targetRatio) {
                              drawWidth = img.height * targetRatio;
                              offsetX = (img.width - drawWidth) / 2;
                          } else {
                              drawHeight = img.width / targetRatio;
                              offsetY = (img.height - drawHeight) / 2;
                          }
                          
                          ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight, 0, 0, targetWidth, targetHeight);
                          
                          // Simple bottom-right watermark for tasks
                          const now = new Date();
                          const timestamp = now.getDate() + '/' + (now.getMonth()+1) + '/' + now.getFullYear() + ' ' + 
                                            String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
                          const coordStr = lat.toFixed(5) + ", " + lng.toFixed(5);
                          
                          ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                          const textWidth = Math.max(ctx.measureText(timestamp).width, ctx.measureText(coordStr).width) + 80;
                          ctx.fillRect(targetWidth - textWidth - 10, targetHeight - 50, textWidth, 40);
                          
                          ctx.fillStyle = "#ffffff";
                          ctx.font = "14px sans-serif";
                          ctx.fillText(timestamp + " | " + coordStr, targetWidth - textWidth, targetHeight - 25);
                          
                          const base64Data = canvas.toDataURL("image/jpeg", 0.8);
                          resolve({ base64Data, lat, lng });
                      };
                      img.src = URL.createObjectURL(file);
                  };
                  
                  input.click();
              }, (err) => {
                  reject("Gagal mendapatkan lokasi GPS untuk catatan kegiatan.");
              }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
          });
      };

    </script>
  </head>
  <body></body>
</html>
