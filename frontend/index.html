<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>reports-v2</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Leaflet Map CSS/JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
      window.initSignaturePad = function(canvasId) {
          const tryInit = () => {
              const canvas = document.getElementById(canvasId);
              if (!canvas) {
                  setTimeout(tryInit, 50);
                  return;
              }
              if (canvas.dataset.initialized) return;
              canvas.dataset.initialized = "true";
              
              const ctx = canvas.getContext('2d');
              let isDrawing = false;
              let lastX = 0; let lastY = 0;
              
              function getPos(e) {
              const rect = canvas.getBoundingClientRect();
              const clientX = e.touches ? e.touches[0].clientX : e.clientX;
              const clientY = e.touches ? e.touches[0].clientY : e.clientY;
              return [clientX - rect.left, clientY - rect.top];
          }
          
          function start(e) {
              e.preventDefault();
              isDrawing = true;
              const pos = getPos(e);
              lastX = pos[0]; lastY = pos[1];
          }
          
          function draw(e) {
              if (!isDrawing) return;
              e.preventDefault();
              const pos = getPos(e);
              ctx.beginPath();
              ctx.moveTo(lastX, lastY);
              ctx.lineTo(pos[0], pos[1]);
              ctx.strokeStyle = '#1a3a5c';
              ctx.lineWidth = 3;
              ctx.lineCap = 'round';
              ctx.stroke();
              lastX = pos[0]; lastY = pos[1];
          }
          
          function stop() { isDrawing = false; }
          
          canvas.addEventListener('mousedown', start);
          canvas.addEventListener('mousemove', draw);
          canvas.addEventListener('mouseup', stop);
          canvas.addEventListener('mouseout', stop);
          canvas.addEventListener('touchstart', start, {passive: false});
          canvas.addEventListener('touchmove', draw, {passive: false});
          canvas.addEventListener('touchend', stop);
        };
        tryInit();
      };

      window.leafletState = { map: null, marker: null };

      window.initLeafletMap = function(mapId) {
          const tryInit = () => {
              const container = document.getElementById(mapId);
              if (!container) {
                  setTimeout(tryInit, 50);
                  return;
              }
              if (container.dataset.initialized) return;
              container.dataset.initialized = "true";
              
              container.innerHTML = "";
              
              const initialLat = -3.973775351502879;
              const initialLng = 122.5057339668274;
              
              const map = L.map(mapId).setView([initialLat, initialLng], 13);
              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                  maxZoom: 19,
                  attribution: '© OpenStreetMap'
              }).addTo(map);
              
              const marker = L.marker([initialLat, initialLng], {draggable: true}).addTo(map);

              window.leafletState.map = map;
              window.leafletState.marker = marker;
          };
          tryInit();
      };

      window.resetLeafletMap = function() {
          if (!window.leafletState.map) return;
          const initialLat = -3.973775351502879;
          const initialLng = 122.5057339668274;
          
          window.leafletState.map.setView([initialLat, initialLng], 13);
          window.leafletState.marker.setLatLng([initialLat, initialLng]);
          
          // Force leaflet to recalculate grid sizes now that display: block is active
          setTimeout(() => { 
              window.leafletState.map.invalidateSize(); 
          }, 100);
      };

      window.getMapSelection = function() {
          if (!window.leafletState.marker) return null;
          const pos = window.leafletState.marker.getLatLng();
          return [pos.lat, pos.lng];
      };
    </script>
  </head>
  <body></body>
</html>
